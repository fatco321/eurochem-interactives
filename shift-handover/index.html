<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121c23">
  <title>Принимаем смену</title>
  <script defer src="./assets/index-CT26naqb.js"></script>
  <link rel="stylesheet" href="./assets/style-BDBNS6B1.css">
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="Рабочее место у комбайна"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-heading">
        <h1>Принимаем смену</h1>
        <div id="route" class="route" hidden>
          <span id="route-title"></span>
          <progress id="route-progress" max="6" value="1" aria-label="Этап приёмки"></progress>
        </div>
        <button id="back" class="back" type="button" hidden><span aria-hidden="true">‹</span> К рабочему месту</button>
      </div>
      <div class="tools">
        <button id="sound" class="icon-button" type="button" aria-label="Звук" aria-pressed="true" title="Выключить звук">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 9h3.7l5-4v14l-5-4H3.5z"/>
            <path class="sound-on" d="M16 8.6a5 5 0 0 1 0 6.8M18.7 6a8.5 8.5 0 0 1 0 12"/>
            <path class="sound-off" d="m16.3 9.3 4.6 5.4m0-5.4-4.6 5.4"/>
          </svg>
        </button>
        <button id="reset" class="icon-button" type="button" disabled aria-label="Начать заново" title="Начать заново">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.3 6.2v5h5M4.6 11.2a7.4 7.4 0 1 1 .9 5.1"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="overview" class="panel briefing" aria-label="Рабочее место" tabindex="-1" hidden>
      <h2 id="overview-title"></h2>
      <p id="overview-task" class="brief-task"></p>
      <button id="open-station" class="primary" type="button" hidden></button>
    </section>

    <div class="hotspots" role="group" aria-label="Рабочие точки">
      <button class="hotspot" type="button" data-station="zone" data-anchor="zone" hidden>Рабочая зона</button>
      <button class="hotspot" type="button" data-station="position" data-anchor="position" hidden>Положение комбайна</button>
      <button class="hotspot" type="button" data-station="support" data-anchor="support" hidden>Вспомогательный участок</button>
      <button class="hotspot" type="button" data-station="panel" data-anchor="panel" hidden>Комбайн</button>
      <button class="hotspot" type="button" data-station="journal" data-anchor="journal" hidden>Журнал</button>
      <button class="hotspot" type="button" data-station="radio" data-anchor="radio" hidden>Связь</button>
      <button class="hotspot hotspot-signal" id="signal" type="button" data-anchor="panel" hidden>Сигнал</button>
    </div>

    <section id="task" class="panel task" aria-labelledby="task-title" hidden>
      <div class="task-heading">
        <h2 id="task-title" tabindex="-1"></h2>
        <button id="inspect-scene" class="inspect-scene" type="button" aria-expanded="true" aria-controls="task-content" aria-label="Свернуть задание и осмотреть сцену" title="Осмотреть сцену">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg>
        </button>
      </div>
      <div id="task-content">
      <div id="task-body"></div>
      <p id="task-feedback" class="status" role="status"></p>
      <button id="continue" class="primary" type="button" hidden>Продолжить <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="conversation" class="conversation" aria-label="Разговор при передаче смены" hidden>
      <div id="handover-dialogue" class="conversation-caption" role="log" aria-live="polite" aria-relevant="additions"></div>
      <button id="dialogue-next" class="primary" type="button" disabled>Перейти к приёмке <span aria-hidden="true">→</span></button>
    </section>
    <div id="welcome" class="entry" hidden>
      <button id="enter" class="primary" type="button">Начать</button>
    </div>
    <div id="completion" class="entry" hidden>
      <div class="completion-card">
        <h2 id="completion-title" tabindex="-1">Вы молодец!</h2>
        <button id="restart" class="primary" type="button">Начать заново</button>
      </div>
    </div>
    <div id="loading" class="loading" role="status"><span></span>Открываем рабочее место</div>
    <noscript>Для работы тренажёра включите JavaScript.</noscript>
  </main>
</body>
</html>
